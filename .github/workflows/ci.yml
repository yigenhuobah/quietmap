name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # 模块通过复合构建引用共享 core；CI 把 xposed-core 检出到工作区并显式
      # 覆盖路径。前置条件：yigenhuobah/xposed-core 必须已公开，否则本 job
      # 会在 checkout 步骤明确失败（不会静默跑一套未共享的实现）。
      XPOSED_CORE_PATH: ${{ github.workspace }}/xposed-core
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout xposed-core
        uses: actions/checkout@v4
        with:
          repository: yigenhuobah/xposed-core
          path: xposed-core
          ref: v0.1.0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # ubuntu-latest 自带 Android SDK 与 cmdline-tools，不再使用
      # android-actions/setup-android：该 action 会尝试安装已被官方仓库移除的
      # 旧 "tools" 包，在新 runner 镜像上随机失败。
      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          SDKM="$(command -v sdkmanager || true)"
          if [ -z "$SDKM" ]; then
            SDKM="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}/cmdline-tools/latest/bin/sdkmanager"
          fi
          yes | "$SDKM" --licenses >/dev/null || true
          "$SDKM" "platforms;android-37.0" "build-tools;37.0.0"

      - name: Create platforms/android-37 fallback symlink
        # compileSdk 37 会被 AGP 解析为 platforms/android-37，而 SDK 仓库里的
        # 平台包名是 android-37.0（安装目录可能为 platforms/android-37.0）。
        # 若 android-37 不存在则建立符号链接回退；只改 CI 的 SDK 目录，不动仓库。
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-$HOME/android-sdk}}"
          if [ ! -e "$SDK_ROOT/platforms/android-37" ] \
              && [ -d "$SDK_ROOT/platforms/android-37.0" ]; then
            ln -s android-37.0 "$SDK_ROOT/platforms/android-37"
            echo "Created symlink: $SDK_ROOT/platforms/android-37 -> android-37.0"
          fi
          ls -l "$SDK_ROOT/platforms"

      # preflight 是发布前同一套门禁：JDK/SDK、版本号与 README/CHANGELOG 一致、
      # 单测、lint。CI 不再单独重复一遍 gradle 命令，避免两套门禁漂移。
      - name: Preflight (versions, CHANGELOG, tests, lint)
        run: bash tools/preflight.sh

      - name: Coverage report
        run: ./gradlew :app:jacocoTestReport --no-daemon

      - name: Upload test, lint and JaCoCo reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/tests
            app/build/reports/lint-results*
            app/build/reports/jacoco
          if-no-files-found: warn
          retention-days: 14
